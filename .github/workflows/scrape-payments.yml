name: janiela-summary
on:
  schedule:
    # 23:20 UTC = 07:20 Manila (next day). Day-of-week 1-6 = Mon-Sat, matching
    # the local bot; the old '* * *' ran Sundays too.
    - cron: '20 23 * * 1-6'
    # 11:30 UTC = 19:30 Manila.
    - cron: '30 11 * * 1-6'
  workflow_dispatch:
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-actions.txt
      - run: playwright install chromium
      - run: python scrape-and-send.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          JANIELA_PIN: ${{ secrets.JANIELA_PIN }}
